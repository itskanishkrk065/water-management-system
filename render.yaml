# ==============================================================================
# WATERGRID V2 — RENDER DEPLOYMENT BLUEPRINT
# Deploys NestJS API as a managed Web Service on Render with automatic HTTPS,
# health checking, zero-downtime deploys, and secure integration with Neon PostgreSQL.
# ==============================================================================
services:
  - type: web
    name: watergrid-api
    runtime: node
    plan: starter
    region: singapore # Closest region to Tamil Nadu / India for low latency
    branch: main
    rootDir: .
    buildCommand: cd backend && npm ci --include=dev && npx prisma generate --schema=prisma/schema.prisma && npx prisma migrate deploy --schema=prisma/schema.prisma && npx nest build
    startCommand: cd backend && npm run start:prod
    healthCheckPath: /api/v1/health
    autoDeploy: false # Manual trigger or webhook-only after CI tests pass

    envVars:
      - key: NODE_ENV
        value: production

      # Authoritative Neon Managed PostgreSQL (Pooled Connection String)
      - key: DATABASE_URL
        sync: false # Set via Render Dashboard: postgresql://...neon.tech/neondb?sslmode=require&pgbouncer=true

      # Neon Direct Connection String (Used for prisma migrate deploy)
      - key: DIRECT_URL
        sync: false # Set via Render Dashboard: postgresql://...neon.tech/neondb?sslmode=require

      # High-Entropy Cryptographic Secrets (Auto-generated by Render)
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_EXPIRATION
        value: 15m

      - key: JWT_REFRESH_EXPIRATION
        value: 7d

      # Permitted Client Origins (Update with approved web & Electron domains)
      - key: CORS_ORIGIN
        value: http://localhost:3000,http://127.0.0.1:3000

      # Observability & Compliance
      - key: LOG_LEVEL
        value: info

      - key: ENABLE_SWAGGER
        value: "false"

      - key: AUDIT_LOG_RETENTION_DAYS
        value: "2555"
